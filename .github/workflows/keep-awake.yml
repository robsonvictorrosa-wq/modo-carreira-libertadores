name: keep-awake
# Mantém o Render acordado das 08:00 à 01:00 (America/Sao_Paulo = UTC-3) → 11:00–04:00 UTC.
on:
  schedule:
    - cron: "*/10 11-23 * * *"
    - cron: "*/10 0-3 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://modo-carreira-libertadores.onrender.com/api/health
